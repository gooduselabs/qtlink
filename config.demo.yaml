# QTLink - English DEMO config (Modbus simulator + local FTP/sFTP/HTTP test servers)
# Vietnamese TT10 demo: python -m qtlink demo -c config.demo.vi.yaml
station:
  station: NUOXA1        # station id (TT10 profile: 6 chars, NUO=water / KHI=air + 3 chars)
  province: BN           # only needed by the tt10_txt profile (Vietnam Circular 10/2021)
  facility: DEMO         # only needed by the tt10_txt profile (4 chars)
  name: "Demo Wastewater Plant"
logger:
  poll_seconds: 5
  file_interval_minutes: 1      # demo: 1 min. Typical: 5
  aggregate: avg                # avg | last
  decimals: 2
  retention_days: 60
  upload_seconds: 10
  disconnect_warn_hours: 12
  outbox_dir: data/outbox
  db_path: data/qtlink.db
  language: en                  # default dashboard language: en | vi
devices:
  - name: analyzer1
    type: tcp                   # tcp | rtu
    host: 127.0.0.1
    port: 5020
    unit_id: 1
  # Device templates from devices/*.yaml (register maps from public manuals):
  # - name: meter1
  #   template: eastron_sdm120
  #   type: rtu
  #   serial_port: /dev/ttyUSB0
  #   baudrate: 9600
  #   unit_id: 1
  #   points: [voltage, current, active_power, total_active_energy]   # or: all
tags:
  - {param: pH,   name: "pH",          unit: "-",    device: analyzer1, register: 0,  data_type: float32, low: 5.5, high: 9}
  - {param: Temp, name: "Temperature", unit: "oC",   device: analyzer1, register: 2,  data_type: float32, high: 40}
  - {param: TSS,  name: "TSS",         unit: "mg/L", device: analyzer1, register: 4,  data_type: float32, high: 100}
  - {param: COD,  name: "COD",         unit: "mg/L", device: analyzer1, register: 6,  data_type: float32, high: 75, status_register: 100}
  - {param: NH4+, name: "Ammonium",    unit: "mg/L", device: analyzer1, register: 8,  data_type: float32, high: 10}
  - {param: Flow out 1, name: "Outflow", unit: "m3/h", device: analyzer1, register: 10, data_type: float32}
sinks:   # every sink has its own store-and-forward queue in SQLite (oldest first, no duplicates)
  - name: Regulator-sFTP
    protocol: sftp              # ftp | ftps | sftp | mqtt | http | influxdb
    format: tt10_txt            # tt10_txt | csv | json | influx
    host: 127.0.0.1
    port: 2222
    username: demo
    password: demo              # production: password_env: QTLINK_SFTP_PASS
    station_folder: NUOXA1
  - name: Backup-FTP-CSV
    protocol: ftp
    format: csv
    host: 127.0.0.1
    port: 2121
    username: demo
    password: demo
    station_folder: NUOXA1
  - name: Webhook-JSON
    protocol: http
    format: json
    url: http://127.0.0.1:8765/ingest
  # - name: Broker
  #   protocol: mqtt
  #   host: test.mosquitto.org
