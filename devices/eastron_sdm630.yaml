# Eastron SDM630-Modbus V2 three-phase energy meter
# Source: Eastron SDM630Modbus Smart Meter Modbus Protocol Implementation V1.8, table 1.2.1 (input registers)
#   https://www.eastroneurope.com/images/uploads/products/protocol/SDM630_MODBUS_Protocol.pdf
# Cross-checked (totals, frequency, energy) against a transcription of the same table:
#   https://plcbytes.com/devices/eastron-sdm630/
# 0-based PDU addresses (manual 30001 -> 0). 32-bit IEEE float, high word first, FC04.
# In 3P3W wiring the line-to-neutral and per-phase power values read 0.
manufacturer: Eastron
model: SDM630-Modbus V2
source: https://www.eastroneurope.com/images/uploads/products/protocol/SDM630_MODBUS_Protocol.pdf
defaults: {function: input, data_type: float32, word_order: big}
points:
  voltage_l1:           {register: 0,   unit: V,   name: Voltage L1-N}          # 30001
  voltage_l2:           {register: 2,   unit: V,   name: Voltage L2-N}          # 30003
  voltage_l3:           {register: 4,   unit: V,   name: Voltage L3-N}          # 30005
  current_l1:           {register: 6,   unit: A,   name: Current L1}            # 30007
  current_l2:           {register: 8,   unit: A,   name: Current L2}            # 30009
  current_l3:           {register: 10,  unit: A,   name: Current L3}            # 30011
  power_l1:             {register: 12,  unit: W,   name: Active power L1}       # 30013
  power_l2:             {register: 14,  unit: W,   name: Active power L2}       # 30015
  power_l3:             {register: 16,  unit: W,   name: Active power L3}       # 30017
  total_active_power:   {register: 52,  unit: W,   name: Total active power}    # 30053
  total_apparent_power: {register: 56,  unit: VA,  name: Total apparent power}  # 30057
  total_reactive_power: {register: 60,  unit: VAr, name: Total reactive power}  # 30061
  total_power_factor:   {register: 62,  unit: "-", name: Total power factor}    # 30063
  frequency:            {register: 70,  unit: Hz,  name: Frequency}             # 30071
  import_active_energy: {register: 72,  unit: kWh, name: Import active energy}  # 30073
  export_active_energy: {register: 74,  unit: kWh, name: Export active energy}  # 30075
  total_active_energy:  {register: 342, unit: kWh, name: Total active energy}   # 30343
