# QTLink - production example: energy meters -> MQTT + InfluxDB + HTTP, with store-and-forward.
# Copy to config.yaml and edit. Vietnam TT10/2021 example: config.example.tt10.yaml
station:
  station: SITE01               # station / site id used in file names, topics and tags
  name: "Plant A - Main switchboard"
logger:
  poll_seconds: 10
  file_interval_minutes: 5      # aggregation window = one queued item per sink
  aggregate: avg                # avg | last
  decimals: 3
  retention_days: 60            # local store-and-forward retention
  upload_seconds: 30
  disconnect_warn_hours: 12
  outbox_dir: data/outbox
  db_path: data/qtlink.db
  language: en
devices:
  - name: main
    template: eastron_sdm630    # devices/eastron_sdm630.yaml
    type: rtu
    serial_port: /dev/ttyUSB0
    baudrate: 9600
    parity: N
    unit_id: 1
    points: [voltage_l1, voltage_l2, voltage_l3, total_active_power, frequency, import_active_energy]
  - name: pv
    template: sunspec_inverter_103
    type: tcp
    host: 192.168.1.50
    unit_id: 1
tags:
  - {param: pv_power, device: pv, point: ac_power}
  - {param: pv_hz,    device: pv, point: frequency, low: 49.5, high: 50.5}
sinks:
  - name: broker
    protocol: mqtt
    format: json
    host: mqtt.example.com
    port: 8883
    tls: true
    username: qtlink
    password_env: QTLINK_MQTT_PASS
    topic: "factory/{station}/energy"
    qos: 1
  - name: influx
    protocol: influxdb          # line protocol over HTTP (v2 API; use db: for 1.x)
    url: https://influx.example.com
    org: my-org
    bucket: energy
    token_env: INFLUX_TOKEN
  - name: webhook
    protocol: http
    format: json
    url: https://example.com/api/qtlink
    token_env: QTLINK_WEBHOOK_TOKEN
  - name: archive
    protocol: sftp
    format: csv
    host: files.example.com
    username: qtlink
    key_file: /etc/qtlink/id_rsa
    remote_root: /upload
    station_folder: SITE01
