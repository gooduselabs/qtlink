# Demo: docker compose --profile demo up   |   Thực tế: docker compose up qtlink
services:
  qtlink:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      TZ: Asia/Ho_Chi_Minh            # TT10: đồng bộ giờ GMT+7
      QTLINK_SFTP_PASS: ${QTLINK_SFTP_PASS:-}
      QTLINK_FTP_PASS: ${QTLINK_FTP_PASS:-}
    volumes:
      - ./config.yaml:/app/config/config.yaml
      - ./data:/app/data
    # Modbus RTU: thêm  devices: ["/dev/ttyUSB0:/dev/ttyUSB0"]
  demo:
    profiles: ["demo"]
    build: .
    ports: ["8080:8080"]
    environment: {TZ: Asia/Ho_Chi_Minh}
    volumes: ["./data:/app/data"]
    command: ["python", "-m", "qtlink", "demo", "-c", "/app/config.demo.yaml"]
